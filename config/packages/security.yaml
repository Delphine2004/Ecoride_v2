security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EMPLOYE, ROLE_PASSENGER, ROLE_DRIVER]
        ROLE_EMPLOYE: [ROLE_PASSENGER, ROLE_DRIVER]
    
    providers:
        app_user_provider:
            { entity: { class: App\Entity\User, property: email } }
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/user, roles: ROLE_EMPLOYE }
        - { path: ^/client, roles: ROLE_PASSENGER }
        - { path: ^/booking, roles: ROLE_PASSENGER }
        - { path: ^/car, roles: ROLE_DRIVER }
        - { path: ^/ride, roles: ROLE_PASSENGER }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
